name: Validate reports

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-rag.txt

      - name: Compile check
        run: python -m py_compile src/*.py

      - name: Publish gate tests (bad fixtures must fail)
        run: python src/test_publish_gate.py

      - name: Report drafter tests (throwaway store, no model)
        run: python src/test_draft_report.py

      - name: Lexicon matcher and window-boundary tests
        run: |
          pip install pytest
          python -m pytest src/test_lexicon.py -q

      - name: Item store tests (schema, triggers, idempotent upserts)
        run: python src/test_item_store.py

      - name: RSS ingestion tests (offline fixtures)
        run: python src/test_ingest_rss.py

      - name: EXP-003A time-holdout selector tests
        run: python src/test_label_tool.py

      - name: Commit guard tests (secret scan, attribution, author identity)
        run: python src/test_commit_guard.py

      - name: First-seen migration and backfill tests (throwaway databases)
        run: python src/test_backfill_first_seen.py

      - name: EXP-004 retrieval tests (no network, no API key)
        run: python src/test_rag.py

      - name: EXP-004 relevance queue and judgment log tests
        run: python src/test_rag_review.py

      - name: EXP-004 question review and freeze tests
        run: python src/test_rag_questions.py

      - name: EXP-004 grounded answers, validators and harness (scripted provider, no network)
        run: |
          python src/test_rag_answer_exp004.py
          python src/test_rag_gen_eval.py

      - name: ask_ari3 aligned to the evaluated Prompt v2 pipeline (scripted provider, no network)
        run: python src/test_ask_ari3.py

      - name: DeepSeek adapter tests (fake HTTP session, no key)
        run: python src/test_llm_deepseek.py

      - name: EXP-004 retriever-selection rule tests (synthetic numbers)
        run: python src/test_rag_select.py

      - name: EXP-005 generation protocol tests (scripted provider, no network)
        run: |
          python src/test_exp005.py
          python src/test_exp005_v2.py

      - name: EXP-005 context-only adjudication tests (throwaway corpus, no network)
        run: python src/test_exp005_adjudicate.py

      - name: EXP-005 SC-1 schema-capacity tests (scripted provider, no network)
        run: python src/test_exp005_schema.py

      - name: EXP-005 SC-1 review freeze and scoring tests (synthetic rows)
        run: python src/test_exp005_sc1_score.py

      - name: Lexicon v1 sense-check deck tests (throwaway store)
        run: python src/test_lexicon_sense.py

      - name: Validate published reports (schema + publish gate + non-blocking confidence warnings)
        run: python src/validate_all_reports.py --store-optional

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: ESLint (includes jsx-a11y accessibility rules)
        run: npx eslint .
        working-directory: web

      - name: Public claim allowlist tests (an unapproved claim never renders)
        run: node --test lib/claims_parse.test.mjs
        working-directory: web
