name: Validate reports

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-rag.txt

      - name: Compile check
        run: python -m py_compile src/*.py

      - name: Publish gate tests (bad fixtures must fail)
        run: python src/test_publish_gate.py

      - name: Item store tests (schema, triggers, idempotent upserts)
        run: python src/test_item_store.py

      - name: RSS ingestion tests (offline fixtures)
        run: python src/test_ingest_rss.py

      - name: EXP-003A time-holdout selector tests
        run: python src/test_label_tool.py

      - name: Commit guard tests (secret scan, attribution, author identity)
        run: python src/test_commit_guard.py

      - name: First-seen migration and backfill tests (throwaway databases)
        run: python src/test_backfill_first_seen.py

      - name: EXP-004 retrieval tests (no network, no API key)
        run: python src/test_rag.py

      - name: EXP-004 relevance queue and judgment log tests
        run: python src/test_rag_review.py

      - name: Validate published reports (schema + publish gate + non-blocking confidence warnings)
        run: python src/validate_all_reports.py

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: ESLint (includes jsx-a11y accessibility rules)
        run: npx eslint .
        working-directory: web
