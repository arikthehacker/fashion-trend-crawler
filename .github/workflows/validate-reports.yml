name: Validate reports

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m py_compile src/*.py

      - name: Validate archived reports (schema + non-blocking confidence warnings)
        run: python src/validate_all_reports.py

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: ESLint (includes jsx-a11y accessibility rules)
        run: npx eslint .
        working-directory: web
